name: termag-next

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/termag.db
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TERMAG_TRUSTED_NETWORK: ${TERMAG_TRUSTED_NETWORK:-true}
      TERMAG_PASSWORD: ${TERMAG_PASSWORD:-}
      # OAuth vars are only used when TERMAG_TRUSTED_NETWORK=false (Path B).
      # `:-` default to empty so trusted-network deployments don't trip warnings.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TERMAG_ALLOWED_EMAIL: ${TERMAG_ALLOWED_EMAIL:-}
      TERMAG_ROOTS: '${TERMAG_ROOTS:-{"Local device":"~/Code"}}'
    volumes:
      - termag-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      TERMAG_HOST: ${TERMAG_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  termag-data:
  caddy-data:
  caddy-config:
