name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag and package versions
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          root=$(node -p 'require("./package.json").version')
          web=$(node -p 'require("./apps/web/package.json").version')
          agent=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/agent-rs/Cargo.toml | head -1)
          [[ "$root" == "$expected" && "$web" == "$expected" && "$agent" == "$expected" ]]

  native:
    name: Native ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --manifest-path apps/agent-rs/Cargo.toml --target "${{ matrix.target }}"
          else
            cargo build --release --locked --manifest-path apps/agent-rs/Cargo.toml --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact="terminalz-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist/package
          cp "apps/agent-rs/target/${{ matrix.target }}/release/terminalz" dist/package/terminalz
          cp LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/${artifact}" terminalz LICENSE README.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$artifact") > "dist/${artifact}.sha256"
          else
            (cd dist && shasum -a 256 "$artifact") > "dist/${artifact}.sha256"
          fi
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: apps/agent-rs/target/${{ matrix.target }}/release/terminalz
          format: spdx-json
          output-file: dist/terminalz-${{ matrix.target }}.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign archive
        shell: bash
        run: |
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.spdx.json
            dist/*.sigstore.json
          if-no-files-found: error

  image:
    name: Multi-platform web image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/terminalz
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/terminalz
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [native, image]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Assemble release assets
        run: |
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          cp infra/docker-compose.yml dist/compose.yml
          cp infra/.env.example dist/terminalz.env.example
          cp scripts/install-agent.sh dist/install-agent.sh
          chmod +x dist/install-agent.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: github-release
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Render formula
        run: |
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          ./scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS dist/terminalz.rb
      - name: Push tap update
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/yeutterg/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/terminalz.rb tap/Formula/terminalz.rb
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/terminalz.rb
          git diff --cached --quiet || git commit -m "terminalz ${GITHUB_REF_NAME}"
          git push
      - name: Tap token not configured
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set; formula was rendered but not pushed."
